services:
  elasticsearch:
    # 한국어(nori) 형태소 분석 플러그인이 포함된 커스텀 이미지 빌드 (docker/elasticsearch/Dockerfile)
    build:
      context: ./docker/elasticsearch
    image: cp-bot-elasticsearch-nori:9.5.0
    container_name: cp-bot-elasticsearch
    environment:
      - discovery.type=single-node
      # 로컬 개발 전용 설정. 보안(xpack.security)을 끄고 시작하면 인증 없이 바로 붙을 수 있음.
      # 운영/스테이징 환경에서는 절대 이 옵션을 사용하지 말고 반드시 xpack.security.enabled=true + TLS + 계정 인증을 적용할 것.
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - cp-bot-network

  # 인덱스 매핑/문서 확인용 UI. 필수는 아니지만 Phase 2 Ingestion 결과를 눈으로 검증할 때 유용함.
  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.0
    container_name: cp-bot-kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - cp-bot-network

volumes:
  es-data:
    driver: local

networks:
  cp-bot-network:
    driver: bridge

<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 사내 규정 Q&amp;A</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-body">
    <main class="login-card">
        <h1 class="login-title">사내 규정 Q&amp;A</h1>
        <p class="login-subtitle">사내 계정으로 로그인하세요.</p>

        <p class="alert alert-error" th:if="${param.error}">아이디 또는 비밀번호가 올바르지 않습니다.</p>
        <p class="alert alert-info" th:if="${param.logout}">로그아웃되었습니다.</p>

        <form th:action="@{/login}" method="post" class="login-form">
            <label class="field-label" for="username">아이디</label>
            <input class="field-input" type="text" id="username" name="username" autocomplete="username" required autofocus>

            <label class="field-label" for="password">비밀번호</label>
            <input class="field-input" type="password" id="password" name="password" autocomplete="current-password" required>

            <button class="btn btn-primary btn-block" type="submit">로그인</button>
        </form>
    </main>
</body>
</html>
